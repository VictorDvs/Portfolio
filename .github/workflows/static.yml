name: Deploy to Netlify

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20' # Utilise la version de Node.js que tu souhaites

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --site ffdb6b07-6442-4736-bb4d-f79578ae026b --auth nfp_kaVdedGwiJjby653ygJpYmKkapNTfxLA6dc5
