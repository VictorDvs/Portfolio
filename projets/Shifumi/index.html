<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifumi</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-size: 1.7em;
            background-color: #555555;
        }
        h1{
            color: #ebe6e0;
        }
.signe {
    display: flex;
    justify-content:space-evenly;
    margin-top: 20px;
}

        .signe img {
            width: 10%;
            margin: 2px;
        }
        .signe img:hover{
            cursor: pointer;
        }

       /* Classes pour les résultats */
.win {
    color: green;
}

.lose {
    color: red;
}

.draw {
    color: rgb(184, 184, 184);
}

#resultat{
    font-weight: bold;
}

#choix, #score, #msgDeFin{
    color: #ebe6e0;
}

#choix, #score, #resultat{
    font-size: 1.3em;
}
#arbitre {
    width: 20%;
    display: none;
}

    </style>
</head>
<body>
    <h1>Choisis vite mais choisis bien !</h1>
    <div class="signe">
        <img id="pierre" src="pierre.png" alt="pierre">
        <img id="feuille" src="feuille.png" alt="feuille">
        <img id="ciseaux" src="ciseaux.png" alt="ciseaux"></div>
        <p id="choix"></p>
        <p id="resultat"></p>
        <p id="score"></p>
        <img src="arbitre.jfif" alt="arbitre" id="arbitre">
        <p id="msgDeFin"></p>
        <script src="script.js"></script>
</body>
</html>
