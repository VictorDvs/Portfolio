<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Quizz Culture Web.</h1>
    <form action="" class="container" id="form">
        <div class="question q1">
            <label for="question1">Qui a inventé le World Wide Web (www)?</label>
            <div class="reponse q1">
                <div>
                    <input type="radio" id="reponse1q1" name="reponse1q1" value="a" checked>
                    <label for="reponse1q1">Bill Gates</label>
                </div>
                <div>
                    <input type="radio" id="reponse2q1" name="reponse1q1" value="b">
                    <label for="reponse2q1">Steve Jobs</label>
                </div>
                <div>
                    <input type="radio" id="reponse3q1" name="reponse1q1" value="c">
                    <label for="reponse3q1">Tim Bernes-lee</label>
                </div>
            </div>
        </div>
        <div class="question q2">
            <label for="question2">Quel est le language de programmation le plus utilisé dans le monde</label>
            <div class="reponse q2">
                <div>
                    <input type="radio" id="reponse1q2" name="reponse1q2" value="a" checked>
                    <label for="reponse1q2">Python</label>
                </div>
                <div>
                    <input type="radio" id="reponse2q2" name="reponse1q2" value="b">
                    <label for="reponse2q2">JavaScript</label>
                </div>
                <div>
                    <input type="radio" id="reponse3q2" name="reponse1q2" value="c">
                    <label for="reponse3q2">Java</label>
                </div>
            </div>
        </div>
        <div class="question q3">
            <label for="question3">Comment afficher "Hello World" dans la console en JavaScript?</label>
            <div class="reponse q3">
                <div>
                    <input type="radio" id="reponse1q3" name="reponse1q3" value="a" checked>
                    <label for="reponse1q3"># Hello World</label>
                </div>
                <div>
                    <input type="radio" id="reponse2q3" name="reponse1q3" value="b">
                    <label for="reponse2q3">print("Hello World")</label>
                </div>
                <div>
                    <input type="radio" id="reponse3q3" name="reponse1q3" value="c">
                    <label for="reponse3q3">console.log("Hello World")</label>
                </div>
            </div>
        </div>
        <div class="question q4">
            <label for="question4">Quest-ce que l'open source?</label>
            <div class="reponse q4">
                <div>
                    <input type="radio" id="reponse1q4" name="reponse1q4" value="a" checked>
                    <label for="reponse1q4">Un logiciel gratuit</label>
                </div>
                <div>
                    <input type="radio" id="reponse2q4" name="reponse1q4" value="b">
                    <label for="reponse2q4">Un logiciel dont le code source est accessible à tous</label>
                </div>
                <div>
                    <input type="radio" id="reponse3q4" name="reponse1q4" value="c">
                    <label for="reponse3q4">Un logiciel avec une interface utilisateur facile à utiliser</label>
                </div>
            </div>
        </div>
        <div class="question q5">
            <label for="question5">Quelle entreprise est le plus grand fournisseur de services de cloud computing dans
                le monde</label>
            <div class="reponse q5">
                <div>
                    <input type="radio" id="reponse1q5" name="reponse1q5" value="a" checked>
                    <label for="reponse1q5">Amazon Web Services</label>
                </div>
                <div>
                    <input type="radio" id="reponse2q5" name="reponse1q5" value="b">
                    <label for="reponse2q5">Google Cloud Platform</label>
                </div>
                <div>
                    <input type="radio" id="reponse3q5" name="reponse1q5" value="c">
                    <label for="reponse3q5">Microsoft Azure</label>
                </div>
            </div>
        </div>
        <button type="submit">Valider</button>
        <div class="resultat"></div>
    </form>
    <script src="script.js"></script>
</body>
</html>
